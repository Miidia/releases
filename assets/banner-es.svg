<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0817"/>
      <stop offset="55%" stop-color="#0E0B1E"/>
      <stop offset="100%" stop-color="#140D2B"/>
    </linearGradient>
    <radialGradient id="glowPurple" cx="24%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowAmber" cx="80%" cy="65%" r="50%">
      <stop offset="0%" stop-color="#F5B740" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logoGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5B37D6"/>
      <stop offset="100%" stop-color="#9D50FF"/>
    </linearGradient>
    <linearGradient id="ytGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EB251C"/>
      <stop offset="100%" stop-color="#B80702"/>
    </linearGradient>
    <linearGradient id="stremioGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8446F6"/>
      <stop offset="100%" stop-color="#5D2EB8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Main Canvas -->
  <rect width="1200" height="540" rx="28" fill="url(#bgGrad)"/>
  <rect width="1200" height="540" rx="28" fill="url(#glowPurple)"/>
  <rect width="1200" height="540" rx="28" fill="url(#glowAmber)"/>

  <!-- Subtle Wave Lines -->
  <g opacity="0.12" fill="none" stroke="#A855F7" stroke-width="1.2">
    <path d="M-20 400 C200 340 380 480 620 430 S920 280 1220 350"/>
    <path d="M-20 420 C200 360 380 500 620 450 S920 300 1220 370"/>
    <path d="M-20 440 C200 380 380 520 620 470 S920 320 1220 390"/>
  </g>

  <!-- Border Frame -->
  <rect x="1.5" y="1.5" width="1197" height="537" rx="26.5" fill="none" stroke="#2D2748" stroke-width="2"/>

  <!-- LEFT COLUMN: Brand & Messaging (ES) -->
  <g transform="translate(52, 56)">
    <!-- App Icon + Brand Name -->
    <g filter="url(#shadow)">
      <rect x="0" y="0" width="76" height="76" rx="20" fill="url(#logoGrad)"/>
      <g fill="#FFFFFF" transform="translate(-5, -5) scale(0.78)">
        <circle cx="33" cy="35.5" r="4.5"/>
        <rect x="28.5" y="43.5" width="9" height="31" rx="4.5"/>
        <circle cx="47" cy="35.5" r="4.5"/>
        <rect x="42.5" y="43.5" width="9" height="31" rx="4.5"/>
        <path d="M59.5 46v26L79 59z" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>
      </g>
    </g>

    <text x="94" y="49" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Miidia</text>

    <!-- Platform Pill -->
    <rect x="240" y="21" width="134" height="30" rx="15" fill="#1E1836" stroke="#4C3B8A" stroke-width="1.2"/>
    <circle cx="257" cy="36" r="4.5" fill="#7EE2B8"/>
    <text x="269" y="41" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#DCD3FF">Android Auto</text>

    <!-- Headline -->
    <text x="0" y="128" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="31" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
      YouTube, Stremio, Radio en Vivo
    </text>
    <text x="0" y="166" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="31" font-weight="800" fill="#C4B5FD" letter-spacing="-0.5">
      y Web en la Pantalla de tu Coche.
    </text>

    <!-- Detailed Subtitle -->
    <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="500" fill="#C3BDD9">
      <text x="0" y="204">La app que transforma tu Android Auto en un verdadero centro</text>
      <text x="0" y="226">multimedia, con acceso a YouTube, radios en vivo de todo el mundo</text>
      <text x="0" y="248">y libre acceso a tus sitios favoritos en la pantalla de tu vehículo.</text>
      <text x="0" y="274" fill="#9E96BA">Cuenta con control remoto desde el móvil y múltiples opciones de</text>
      <text x="0" y="296" fill="#9E96BA">personalización: diseño, idioma, página de inicio, webs y radios favoritas.</text>
    </g>

    <!-- Feature Pills -->
    <g transform="translate(0, 326)" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700">
      <rect x="0" y="0" width="152" height="36" rx="11" fill="#17132B" stroke="#352C5A" stroke-width="1.2"/>
      <text x="76" y="23" fill="#E8EAED" text-anchor="middle">⚡ Sin Root / Sin PC</text>

      <rect x="162" y="0" width="166" height="36" rx="11" fill="#17132B" stroke="#352C5A" stroke-width="1.2"/>
      <text x="245" y="23" fill="#E8EAED" text-anchor="middle">📱 Control en el Móvil</text>

      <rect x="338" y="0" width="144" height="36" rx="11" fill="#17132B" stroke="#352C5A" stroke-width="1.2"/>
      <text x="410" y="23" fill="#E8EAED" text-anchor="middle">🌐 PT · EN · ES</text>
    </g>

    <!-- Bottom Status Bar -->
    <g transform="translate(0, 394)" font-family="system-ui, -apple-system, 'Segoe UI', monospace" font-size="12.5" fill="#8E87AB">
      <text x="0" y="16">📦 com.miidia.auto  ·  🎁 7 Días de Prueba Gratis  ·  🔄 Auto-Update Integrado</text>
    </g>
  </g>

  <!-- RIGHT COLUMN: Faithful Car Head-Unit Screen (ES — Updated Horizontal Top Bar + 3x2 Grid) -->
  <g transform="translate(566, 56)" filter="url(#shadow)">
    <rect x="0" y="0" width="584" height="428" rx="24" fill="#07080A" stroke="#2A2D35" stroke-width="2.5"/>
    <rect x="8" y="8" width="568" height="412" rx="17" fill="#000000"/>

    <!-- HORIZONTAL TOP BAR (y=8..70) -->
    <line x1="8" y1="70" x2="576" y2="70" stroke="#181A1E" stroke-width="1.2"/>

    <!-- 1. Miidia Purple App Icon -->
    <rect x="18" y="21" width="36" height="36" rx="9" fill="url(#logoGrad)"/>
    <g fill="#FFFFFF" transform="translate(15.5, 18.5) scale(0.38)">
      <circle cx="33" cy="35.5" r="4.5"/>
      <rect x="28.5" y="43.5" width="9" height="31" rx="4.5"/>
      <circle cx="47" cy="35.5" r="4.5"/>
      <rect x="42.5" y="43.5" width="9" height="31" rx="4.5"/>
      <path d="M59.5 46v26L79 59z" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>
    </g>

    <!-- 2. Home Circle Button -->
    <circle cx="79" cy="39" r="19" fill="#1D1F24"/>
    <path d="M72 40.5 L79 34 L86 40.5 V46.5 H81.5 V42 H76.5 V46.5 H72 Z" fill="none" stroke="#F5B740" stroke-width="1.7" stroke-linejoin="round"/>

    <!-- 3. History Circle Button -->
    <circle cx="123" cy="39" r="19" fill="#1D1F24"/>
    <circle cx="123" cy="39" r="7.5" fill="none" stroke="#C8CDD5" stroke-width="1.6"/>
    <path d="M123 35 V39 L125.8 40.8" fill="none" stroke="#C8CDD5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 4. Settings Circle Button -->
    <circle cx="167" cy="39" r="19" fill="#1D1F24"/>
    <g transform="translate(167, 39)" fill="none" stroke="#C8CDD5" stroke-width="1.5">
      <circle cx="0" cy="0" r="2.8"/>
      <circle cx="0" cy="0" r="6.2" stroke-dasharray="3 2"/>
    </g>

    <!-- 5. Zoom Controls: (A+) 95% (A-) -->
    <circle cx="218" cy="39" r="19" fill="#1D1F24"/>
    <text x="218" y="44" font-family="system-ui, sans-serif" font-size="13.5" font-weight="800" fill="#F2F3F5" text-anchor="middle">A+</text>

    <text x="255" y="43.5" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#F5B740" text-anchor="middle">95%</text>

    <circle cx="292" cy="39" r="19" fill="#1D1F24"/>
    <text x="292" y="44" font-family="system-ui, sans-serif" font-size="13.5" font-weight="800" fill="#F2F3F5" text-anchor="middle">A−</text>

    <!-- 6. Search Bar with Mic Button -->
    <rect x="319" y="17" width="245" height="44" rx="12" fill="#0B0C0E" stroke="#22252A" stroke-width="1.2"/>
    <circle cx="337" cy="38" r="5" fill="none" stroke="#F5B740" stroke-width="1.9"/>
    <line x1="341" y1="42" x2="345" y2="46" stroke="#F5B740" stroke-width="1.9" stroke-linecap="round"/>
    <text x="353" y="43.5" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#8C919A">Dirección o búsqueda...</text>
    <!-- Mic Button -->
    <rect x="524" y="22" width="34" height="34" rx="9" fill="#1F2126"/>
    <rect x="538.5" y="30" width="5" height="9.5" rx="2.5" fill="none" stroke="#E2E5E9" stroke-width="1.5"/>
    <path d="M535.5 36 A5.5 5.5 0 0 0 546.5 36 M541 41.5 V44.5 M538 44.5 H544" fill="none" stroke="#E2E5E9" stroke-width="1.5" stroke-linecap="round"/>

    <!-- LEFT BODY COLUMN: Big Clock (12:41) + Two-Line Date + Gold Continue Card -->
    <text x="22" y="158" font-family="'Barlow Condensed', system-ui, -apple-system, sans-serif" font-size="68" font-weight="800" fill="#F5F6F8" letter-spacing="-1">12:41</text>
    <text x="23" y="187" font-family="system-ui, sans-serif" font-size="15.5" font-weight="700" fill="#E1E4E8">Sábado, 14 de</text>
    <text x="23" y="208" font-family="system-ui, sans-serif" font-size="15.5" font-weight="700" fill="#E1E4E8">noviembre</text>

    <!-- Gold Continue Card -->
    <rect x="22" y="280" width="152" height="58" rx="13" fill="#F5B740"/>
    <path d="M37 302 L47 309 L37 316 Z" fill="#141414"/>
    <text x="54" y="305" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#141414">Continuar Yo...</text>
    <text x="54" y="322" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#2A210B">0:47 · Menos É Mai...</text>
    <rect x="137" y="290" width="30" height="38" rx="9" fill="#C99224"/>
    <path d="M150 304 L155 309 L150 314" fill="none" stroke="#141414" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- RIGHT BODY AREA: FAVORITOS (3x2 Grid) -->
    <text x="192" y="97" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#9BA1AA" letter-spacing="1.4">FAVORITOS</text>

    <!-- ROW 1, COL 1: YouTube -->
    <g transform="translate(192, 110)">
      <rect x="0" y="0" width="118" height="138" rx="14" fill="#0D0F12" stroke="#22252A" stroke-width="1.2"/>
      <rect x="14" y="14" width="44" height="44" rx="11" fill="url(#ytGrad)"/>
      <text x="36" y="43" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">Y</text>
      <text x="14" y="96" font-family="system-ui, sans-serif" font-size="14.5" font-weight="800" fill="#F2F3F5">YouTube</text>
      <text x="14" y="115" font-family="system-ui, sans-serif" font-size="11" fill="#8C919A">youtube.com</text>
    </g>

    <!-- ROW 1, COL 2: Stremio -->
    <g transform="translate(319, 110)">
      <rect x="0" y="0" width="118" height="138" rx="14" fill="#0D0F12" stroke="#22252A" stroke-width="1.2"/>
      <rect x="14" y="14" width="44" height="44" rx="11" fill="url(#stremioGrad)"/>
      <text x="36" y="43" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">S</text>
      <text x="14" y="96" font-family="system-ui, sans-serif" font-size="14.5" font-weight="800" fill="#F2F3F5">Stremio</text>
      <text x="14" y="115" font-family="system-ui, sans-serif" font-size="11" fill="#8C919A">web.stremio.com</text>
    </g>

    <!-- ROW 1, COL 3: Radio -->
    <g transform="translate(446, 110)">
      <rect x="0" y="0" width="118" height="138" rx="14" fill="#0D0F12" stroke="#22252A" stroke-width="1.2"/>
      <rect x="14" y="14" width="44" height="44" rx="11" fill="#FFFFFF"/>
      <line x1="28" y1="28" x2="42" y2="22" stroke="#8C919A" stroke-width="2" stroke-linecap="round"/>
      <rect x="24" y="28" width="24" height="16" rx="3.5" fill="#E53935"/>
      <circle cx="41" cy="36" r="4" fill="#FFFFFF"/>
      <rect x="27" y="32" width="6" height="2" rx="1" fill="#FFFFFF"/>
      <rect x="27" y="36" width="6" height="2" rx="1" fill="#FFFFFF"/>
      <text x="14" y="96" font-family="system-ui, sans-serif" font-size="14.5" font-weight="800" fill="#F2F3F5">Radio</text>
      <text x="14" y="115" font-family="system-ui, sans-serif" font-size="11" fill="#8C919A">Emisoras en vivo</text>
    </g>

    <!-- ROW 2, COL 1: Google -->
    <g transform="translate(192, 258)">
      <rect x="0" y="0" width="118" height="138" rx="14" fill="#0D0F12" stroke="#22252A" stroke-width="1.2"/>
      <rect x="14" y="14" width="44" height="44" rx="11" fill="url(#stremioGrad)"/>
      <text x="36" y="43" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">G</text>
      <text x="14" y="96" font-family="system-ui, sans-serif" font-size="14.5" font-weight="800" fill="#F2F3F5">Google</text>
      <text x="14" y="115" font-family="system-ui, sans-serif" font-size="11" fill="#8C919A">google.com</text>
    </g>

    <!-- ROW 2, COL 2: Ajustes -->
    <g transform="translate(319, 258)">
      <rect x="0" y="0" width="118" height="138" rx="14" fill="#0D0F12" stroke="#22252A" stroke-width="1.2"/>
      <rect x="14" y="14" width="44" height="44" rx="11" fill="#25282E"/>
      <g transform="translate(36, 36)" fill="none" stroke="#FFFFFF" stroke-width="1.8">
        <circle cx="0" cy="0" r="3.5"/>
        <circle cx="0" cy="0" r="7.5" stroke-dasharray="3.5 2.4"/>
      </g>
      <text x="14" y="96" font-family="system-ui, sans-serif" font-size="14.5" font-weight="800" fill="#F2F3F5">Ajustes</text>
      <text x="14" y="115" font-family="system-ui, sans-serif" font-size="11" fill="#8C919A">Escala, barra, inicio</text>
    </g>

    <!-- ROW 2, COL 3: Añadir -->
    <g transform="translate(446, 258)">
      <rect x="0" y="0" width="118" height="138" rx="14" fill="#0D0F12" stroke="#22252A" stroke-width="1.2"/>
      <rect x="14" y="14" width="44" height="44" rx="11" fill="#1B1E23"/>
      <path d="M36 29 V43 M29 36 H43" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
      <text x="14" y="96" font-family="system-ui, sans-serif" font-size="14.5" font-weight="800" fill="#F2F3F5">Añadir</text>
      <text x="14" y="115" font-family="system-ui, sans-serif" font-size="11" fill="#8C919A">página actual</text>
    </g>
  </g>
</svg>
